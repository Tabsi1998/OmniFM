services:
  mongodb:
    image: mongo:7.0.39-jammy
    container_name: omnifm-mongodb
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      MONGO_INITDB_DATABASE: radio_bot

  omnifm:
    build: .
    container_name: omnifm
    init: true
    user: "${OMNIFM_CONTAINER_UID:-1000}:${OMNIFM_CONTAINER_GID:-1000}"
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: radio_bot
      OMNIFM_RUNTIME_DATA_DIR: /app/runtime-data
    ports:
      - "${WEB_PORT:-8081}:${WEB_INTERNAL_PORT:-8080}"
    volumes:
      - ./runtime-data:/app/runtime-data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "--fail",
          "--max-time", "5",
          "http://127.0.0.1:${WEB_INTERNAL_PORT:-8080}/api/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
