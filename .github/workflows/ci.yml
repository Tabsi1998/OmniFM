name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The Python backend under backend/ is archived legacy/reference code.
# CI intentionally gates the canonical Node.js runtime, React frontend, and Docker image only.
jobs:
  syntax:
    name: syntax (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run repo hygiene check
        run: npm run test:repo-hygiene

      - name: Run syntax checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test_reports/ci
          npm run test:syntax 2>&1 | tee test_reports/ci/syntax-node${{ matrix.node-version }}.log

      - name: Upload syntax logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: syntax-node${{ matrix.node-version }}-logs
          path: test_reports/ci/syntax-node${{ matrix.node-version }}.log
          if-no-files-found: error
          retention-days: 14

  unit:
    name: unit (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    services:
      mongo:
        image: mongo:7.0.39-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand({ ping: 1 })\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      MONGO_URL: mongodb://127.0.0.1:27017/omnifm_ci
      DB_NAME: omnifm_ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test_reports/ci
          npm run test:unit 2>&1 | tee test_reports/ci/unit-node${{ matrix.node-version }}.log

      - name: Upload unit logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-node${{ matrix.node-version }}-logs
          path: test_reports/ci/unit-node${{ matrix.node-version }}.log
          if-no-files-found: error
          retention-days: 14

  voice-codec:
    name: native voice codec (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run native Opus encode/decode smoke
        run: npm run test:voice-codec

  mongo-smoke:
    name: mongo smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7.0.39-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand({ ping: 1 })\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      MONGO_URL: mongodb://127.0.0.1:27017/omnifm_ci
      DB_NAME: omnifm_ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run Mongo smoke test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test_reports/ci
          node --input-type=module -e "const db = await import('./src/lib/db.js'); await db.connect(); if (!db.getDb()) throw new Error('Mongo connection failed'); await db.close();" 2>&1 | tee test_reports/ci/mongo-smoke.log

      - name: Upload Mongo smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mongo-smoke-log
          path: test_reports/ci/mongo-smoke.log
          if-no-files-found: error
          retention-days: 14

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../test_reports/ci
          : > ../test_reports/ci/frontend-build.log
          npm ci 2>&1 | tee -a ../test_reports/ci/frontend-build.log
          npm run build 2>&1 | tee -a ../test_reports/ci/frontend-build.log
        working-directory: frontend

      - name: Upload frontend build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-log
          path: test_reports/ci/frontend-build.log
          if-no-files-found: error
          retention-days: 14

  docker-build:
    name: docker build and entrypoint smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose manifests
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.split.yml --profile worker-1 config --quiet

      - name: Build container
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test_reports/ci
          docker build -t omnifm-ci . 2>&1 | tee test_reports/ci/docker-build.log

      - name: Start entrypoint as the unprivileged runtime user
        shell: bash
        run: |
          set -o pipefail
          docker run --rm omnifm-ci node -e "const fs = require('fs'); if (process.getuid() === 0) throw new Error('runtime must not run as root'); for (const file of ['stations.json', 'owner-audit.json']) { if (!fs.statSync('/app/runtime-data/' + file).isFile()) throw new Error('missing initialized runtime file: ' + file); } console.log('entrypoint runtime-data smoke passed');" 2>&1 | tee test_reports/ci/docker-entrypoint-smoke.log

      - name: Smoke native audio and FFmpeg in the runtime image
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -i --entrypoint node omnifm-ci - <<'NODE' 2>&1 | tee test_reports/ci/docker-audio-smoke.log
          const { spawnSync } = require('node:child_process');
          const { OpusEncoder } = require('@discordjs/opus');
          const pcm = Buffer.alloc(960 * 2 * 2);
          const encoder = new OpusEncoder(48_000, 2);
          try {
            const packet = encoder.encode(pcm);
            if (!packet.length) throw new Error('native Opus encoder produced no packet');
          } finally {
            encoder.delete?.();
          }
          const ffmpeg = spawnSync('ffmpeg', ['-hide_banner', '-loglevel', 'error', '-f', 's16le', '-ar', '48000', '-ac', '2', '-i', 'pipe:0', '-f', 'null', '-'], { input: pcm });
          if (ffmpeg.status !== 0) throw new Error(ffmpeg.stderr.toString() || 'FFmpeg PCM smoke failed');
          console.log('runtime native Opus and FFmpeg smoke passed');
          NODE

      - name: Upload docker build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-build-log
          path: |
            test_reports/ci/docker-build.log
            test_reports/ci/docker-entrypoint-smoke.log
            test_reports/ci/docker-audio-smoke.log
          if-no-files-found: error
          retention-days: 14
