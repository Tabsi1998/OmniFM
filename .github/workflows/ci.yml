name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Production architecture: React :3000, FastAPI :8001, MongoDB, and the
# separate Node.js Discord runtime. CI gates every production component.
jobs:
  syntax:
    name: syntax (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run repo hygiene check
        run: npm run test:repo-hygiene

      - name: Run syntax checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test_reports/ci
          npm run test:syntax 2>&1 | tee test_reports/ci/syntax-node${{ matrix.node-version }}.log

      - name: Validate deployment shell scripts
        run: bash -n start.sh stop.sh update.sh

      - name: Upload syntax logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: syntax-node${{ matrix.node-version }}-logs
          path: test_reports/ci/syntax-node${{ matrix.node-version }}.log
          if-no-files-found: error
          retention-days: 14

  unit:
    name: unit (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    services:
      mongo:
        image: mongo:7.0.39-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand({ ping: 1 })\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      MONGO_URL: mongodb://127.0.0.1:27017/omnifm_ci
      DB_NAME: omnifm_ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test_reports/ci
          npm run test:unit 2>&1 | tee test_reports/ci/unit-node${{ matrix.node-version }}.log

      - name: Upload unit logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-node${{ matrix.node-version }}-logs
          path: test_reports/ci/unit-node${{ matrix.node-version }}.log
          if-no-files-found: error
          retention-days: 14

  voice-codec:
    name: native voice codec (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run native Opus encode/decode smoke
        run: npm run test:voice-codec

  mongo-smoke:
    name: mongo smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7.0.39-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand({ ping: 1 })\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      MONGO_URL: mongodb://127.0.0.1:27017/omnifm_ci
      DB_NAME: omnifm_ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run Mongo smoke test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test_reports/ci
          node --input-type=module -e "const db = await import('./src/lib/db.js'); await db.connect(); if (!db.getDb()) throw new Error('Mongo connection failed'); await db.close();" 2>&1 | tee test_reports/ci/mongo-smoke.log

      - name: Upload Mongo smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mongo-smoke-log
          path: test_reports/ci/mongo-smoke.log
          if-no-files-found: error
          retention-days: 14

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../test_reports/ci
          : > ../test_reports/ci/frontend-build.log
          npm ci 2>&1 | tee -a ../test_reports/ci/frontend-build.log
          npm run build 2>&1 | tee -a ../test_reports/ci/frontend-build.log
        working-directory: frontend

      - name: Upload frontend build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-log
          path: test_reports/ci/frontend-build.log
          if-no-files-found: error
          retention-days: 14

  fastapi-smoke:
    name: FastAPI production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0.39-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand({ ping: 1 })\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: omnifm_ci_fastapi
      API_ADMIN_TOKEN: ci-owner-token
      SEED_DEMO_DATA: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate and smoke FastAPI
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile backend/server.py
          python -m uvicorn backend.server:app --host 127.0.0.1 --port 8001 >fastapi.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8001/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/api/health | python -m json.tool
          curl -fsS http://127.0.0.1:8001/api/stats | python -m json.tool
          curl -fsS -H 'X-Admin-Token: ci-owner-token' http://127.0.0.1:8001/api/admin/config | python -m json.tool
          curl -fsS -X PUT -H 'X-Admin-Token: ci-owner-token' -H 'Content-Type: application/json' \
            --data '{"section":"system","data":{"discordOAuth":{"clientId":"123456789012345678","clientSecret":"ci-secret","redirectUri":"https://example.test/api/auth/discord/callback","scopes":"identify guilds"},"smtp":{"enabled":false},"audioRecognition":{"enabled":false},"songHistory":{"enabled":true,"maxPerGuild":100}}}' \
            http://127.0.0.1:8001/api/admin/config | python -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["data"]["discordOAuth"]["clientSecretSet"] is True and d["data"]["discordOAuth"]["clientSecret"] == "••••••••"'
          curl -fsS -X PUT -H 'X-Admin-Token: ci-owner-token' -H 'Content-Type: application/json' \
            --data '{"section":"system","data":{"discordOAuth":{"clientId":"123456789012345678","clientSecret":"••••••••","clientSecretSet":true,"redirectUri":"https://example.test/api/auth/discord/callback","scopes":"identify guilds"}}}' \
            http://127.0.0.1:8001/api/admin/config >/dev/null
          python -c 'from pymongo import MongoClient; d=MongoClient("mongodb://127.0.0.1:27017").omnifm_ci_fastapi.owner_config.find_one({"_id":"global"}); o=d["system"]["discordOAuth"]; assert o["clientSecret"] == "ci-secret" and "clientSecretSet" not in o'
          curl -fsS -X POST -H 'X-Admin-Token: ci-owner-token' -H 'Content-Type: application/json' \
            --data '{"integration":"songhistory"}' \
            http://127.0.0.1:8001/api/admin/integrations/test | python -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["results"]["songHistory"]["ok"]'
          curl -fsS -X POST -H 'X-Admin-Token: ci-owner-token' -H 'Content-Type: application/json' \
            --data '{"email":"owner-contract@example.test","tier":"pro","months":1,"seats":1}' \
            http://127.0.0.1:8001/api/admin/licenses | python -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["licenseKey"].startswith("OMNI-")'
