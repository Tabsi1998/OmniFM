version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
    open-pull-requests-limit: 3
    # One PR per week for minor and patch updates. Major updates stay separate,
    # so a breaking change never hides inside a routine bump.
    groups:
      npm-runtime-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - npm

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
    open-pull-requests-limit: 3
    groups:
      frontend-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend

  # Production FastAPI backend dependencies.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
    open-pull-requests-limit: 3
    groups:
      pip-backend:
        patterns:
          - "*"
    labels:
      - dependencies
      - backend
