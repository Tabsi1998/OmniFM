# OmniFM — nginx Reverse-Proxy
#
# WICHTIG: Läuft der Proxy auf einer ANDEREN Maschine als OmniFM,
# müssen die proxy_pass-Ziele auf die LAN-IP des OmniFM-Servers zeigen
# (NICHT 127.0.0.1). Hier vorkonfiguriert für:
#     Proxy   : 192.168.2.100
#     OmniFM  : 192.168.2.253   (Frontend :3000, Backend :8001)
# Passe OMNIFM_HOST an, falls sich die IP ändert.
#
# Installation (auf dem Proxy-Server 192.168.2.100):
#   sudo cp omnifm.conf /etc/nginx/sites-available/omnifm.conf
#   sudo ln -sf /etc/nginx/sites-available/omnifm.conf /etc/nginx/sites-enabled/omnifm.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (auf dem Proxy):
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d omnifm.xyz -d www.omnifm.xyz
#
# Frontend muss mit der Domain gebaut sein (auf 192.168.2.253):
#   PUBLIC_URL=https://omnifm.xyz ./start.sh

upstream omnifm_frontend { server 192.168.2.253:3000; }
upstream omnifm_backend  { server 192.168.2.253:8001; }

server {
    listen 80;
    listen [::]:80;
    server_name omnifm.xyz www.omnifm.xyz;

    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://discord.com https://*.stripe.com https://www.google-analytics.com https://region1.google-analytics.com; media-src 'self' https:; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://discord.com https://checkout.stripe.com" always;

    # ---- Backend-API -> OmniFM :8001 ----
    location /api/ {
        proxy_pass http://omnifm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # ---- Frontend (React Build via 'serve') -> OmniFM :3000 ----
    location / {
        proxy_pass http://omnifm_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
