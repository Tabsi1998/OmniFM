# OmniFM - nginx Reverse Proxy for the canonical Node.js runtime
#
# The Node process serves both the React build and every /api endpoint. Do not
# split /api to the archived Python backend; that would mix release versions.
# Change the upstream address when nginx and OmniFM run on separate machines.

upstream omnifm_node {
    server 192.168.2.253:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name omnifm.xyz www.omnifm.xyz;

    client_max_body_size 50m;

    location / {
        proxy_pass http://omnifm_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }
}
