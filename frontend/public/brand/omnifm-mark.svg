<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="OmniFM">
  <defs>
    <linearGradient id="omniGrad" x1="18" y1="44" x2="102" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b00"/>
      <stop offset="0.55" stop-color="#ff2a5f"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="omniBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff6b00"/>
