x-omnifm-volumes: &omnifm_volumes
  - ./runtime-data:/app/runtime-data

x-omnifm-worker-environment: &omnifm_worker_environment
  MONGO_URL: mongodb://mongodb:27017
  DB_NAME: radio_bot
  BOT_PROCESS_ROLE: worker
  OMNIFM_RUNTIME_DATA_DIR: /app/runtime-data

x-omnifm-worker-base: &omnifm_worker_base
  build: .
  init: true
  user: "${OMNIFM_CONTAINER_UID:-1000}:${OMNIFM_CONTAINER_GID:-1000}"
  env_file:
    - .env
  command: ["node", "src/entrypoints/worker.js"]
  environment: *omnifm_worker_environment
  volumes: *omnifm_volumes
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    mongodb:
      condition: service_healthy

services:
  mongodb:
    image: mongo:7.0.39-jammy
    container_name: omnifm-mongodb
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - MONGO_INITDB_DATABASE=radio_bot

  omnifm:
    build: .
    container_name: omnifm
    init: true
    user: "${OMNIFM_CONTAINER_UID:-1000}:${OMNIFM_CONTAINER_GID:-1000}"
    env_file:
      - .env
    command: ["node", "src/entrypoints/commander.js"]
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=radio_bot
      - BOT_PROCESS_ROLE=commander
      - OMNIFM_RUNTIME_DATA_DIR=/app/runtime-data
    ports:
      - "${WEB_PORT:-8081}:${WEB_INTERNAL_PORT:-8080}"
    volumes: *omnifm_volumes
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.WEB_INTERNAL_PORT || 8080) + '/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      mongodb:
        condition: service_healthy

  omnifm-worker-1:
    <<: *omnifm_worker_base
    profiles: ["worker-1"]
    container_name: omnifm-worker-1
    environment:
      <<: *omnifm_worker_environment
      BOT_PROCESS_INDEX: "1"

